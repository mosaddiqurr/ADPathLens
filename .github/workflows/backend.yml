name: Backend
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff format --check app tests scripts alembic/env.py ../scripts/adpathlens.py
      - run: ruff check app tests scripts alembic/env.py ../scripts/adpathlens.py
      - run: mypy app --no-incremental
      - run: pytest --cov=app --cov-fail-under=65
      - run: bandit -r app -q
