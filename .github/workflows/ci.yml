name: CI
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: pip check
      - run: ruff format --check --no-cache app tests
      - run: ruff check --no-cache app tests
      - run: mypy --no-incremental app
      - run: pytest -p no:cacheprovider -q
      - run: bandit -q -r app
      - run: pip-audit -r requirements-dev.lock
      - run: python ../scripts/verify-publication.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit

  browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r backend/requirements-dev.lock
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - run: VITE_API_URL=http://127.0.0.1:8021 npm run build -- --outDir ../var/verification/split-dist
        working-directory: frontend
      - run: E2E_BACKEND_PORT=8021 E2E_FRONTEND_PORT=4175 E2E_PREVIEW_DIR=../var/verification/split-dist npx playwright test --project desktop --grep 'home opens directly|CSV pair'
        working-directory: frontend
