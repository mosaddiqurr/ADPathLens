name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: pip check
      - run: ruff format --check --no-cache .
      - run: ruff check --no-cache .
      - run: mypy --no-incremental app
      - run: pytest -p no:cacheprovider -q
      - run: alembic upgrade head
      - run: alembic check
      - run: pip-audit -r requirements.lock
      - run: pip-audit -r requirements-dev.lock
      - run: bandit -q -r app

  demo-target:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: demo-target/requirements.lock
      - run: pip install -r requirements.lock pytest==9.0.3 ruff==0.12.10 pip-audit==2.9.0 bandit==1.9.4
      - run: pip check
      - run: ruff format --check --no-cache .
      - run: ruff check --no-cache .
      - run: pytest -p no:cacheprovider -q
      - run: pip-audit -r requirements.lock
      - run: bandit -q -r app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm audit

  browser:
    runs-on: ubuntu-latest
    needs: [backend, demo-target, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.lock
            demo-target/requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r backend/requirements-dev.lock -r demo-target/requirements.lock
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run desktop/mobile acceptance and axe scans
        shell: bash
        run: |
          export AUTHZDIFF_RUNTIME_DIR="$RUNNER_TEMP/authzdiff-runtime"
          ./scripts/runtime.sh start
          trap './scripts/runtime.sh stop' EXIT
          source "$AUTHZDIFF_RUNTIME_DIR/local-secrets.env"
          cd frontend
          AUTHZDIFF_E2E_SETUP_TOKEN="$FIRST_ADMIN_SETUP_TOKEN" npx playwright test
