name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: ruff format --check --no-cache .
      - run: ruff check --no-cache .
      - run: mypy app
      - run: pytest -p no:cacheprovider -q
      - run: alembic upgrade head
      - run: alembic check
      - run: pip-audit -r requirements.lock
      - run: pip-audit -r requirements-dev.lock

  demo-target:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: demo-target/requirements.lock
      - run: pip install -r requirements.lock pytest==9.0.3 ruff==0.12.10 pip-audit==2.9.0
      - run: ruff format --check --no-cache .
      - run: ruff check --no-cache .
      - run: pytest -p no:cacheprovider -q
      - run: pip-audit -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      # The only current high advisory is React Router RSC-only; this SPA does
      # not enable RSC or server actions. See docs/KNOWN-LIMITATIONS.md.
      - run: npm audit --omit=dev --audit-level=critical
