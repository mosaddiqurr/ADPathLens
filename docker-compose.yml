services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adpathlens
      POSTGRES_USER: adpathlens
      POSTGRES_PASSWORD: adpathlens-dev-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adpathlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      APP_SECRET_KEY: docker-development-secret-change-before-production
      DATABASE_URL: postgresql+asyncpg://adpathlens:adpathlens-dev-only@postgres/adpathlens
      ALLOWED_FRONTEND_ORIGINS: http://localhost:8080
      REPORT_STORAGE_PATH: /app/reports
    volumes:
      - reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  reports:

