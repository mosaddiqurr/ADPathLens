services:
  backend:
    build: ./backend
    environment:
      ALLOWED_FRONTEND_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

networks:
  internal:
    driver: bridge
