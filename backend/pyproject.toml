[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "authzdiff"
version = "1.0.0"
description = "Compare authorization snapshots and HAR captures with explainable risk and evidence exports"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4==4.13.5",
  "fastapi==0.141.1",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "reportlab==4.4.3",
  "starlette==1.3.1",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4", "hypothesis==6.138.13", "httpx==0.28.1",
  "mypy==1.17.1", "pip-audit==2.9.0", "pytest==9.0.3",
  "pytest-asyncio==1.4.0", "ruff==0.12.10",
]

[project.urls]
Repository = "https://github.com/mosaddiqurr/ADPathLens"
Documentation = "https://github.com/mosaddiqurr/ADPathLens#readme"
Issues = "https://github.com/mosaddiqurr/ADPathLens/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
