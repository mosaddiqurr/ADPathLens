[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adpathlens"
version = "1.0.0rc1"
description = "Defensive Active Directory attack-path lab visualizer"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "fastapi>=0.142.2,<0.143",
  "starlette>=1.3.1,<2",
  "jinja2>=3.1,<4",
  "networkx>=3.4,<4",
  "pillow>=13.0.0,<14",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.2,<5",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "certifi>=2026.10.19",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.9,<1",
  "types-networkx>=3.4,<4",
  "types-reportlab>=4.2,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]
